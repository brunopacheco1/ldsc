# ORT repository configuration (https://oss-review-toolkit.org/ort/docs/configuration/ort-yml):
# the policy judges what is shipped in the images, not tooling around it.
analyzer:
  # Do not analyze excluded projects and scopes at all. The fuzz workspace (fuzz/Cargo.toml)
  # pulls the crates in by path; analyzing it next to the main workspace broke the
  # dependency graph ("Key ... is missing in the map").
  skip_excluded: true
excludes:
  paths:
    - pattern: ".github/**"
      reason: "BUILD_TOOL_OF"
      comment: "CI workflows and their GitHub Actions; not distributed."
    - pattern: "fuzz/**"
      reason: "TEST_TOOL_OF"
      comment: "Fuzz targets; not distributed."
    - pattern: "scripts/**"
      reason: "BUILD_TOOL_OF"
      comment: "Measurement and CI helper scripts; not distributed."
  scopes:
    - pattern: "dev-dependencies"
      reason: "TEST_DEPENDENCY_OF"
      comment: "Test-only dependencies are not distributed."
    - pattern: "build-dependencies"
      reason: "BUILD_DEPENDENCY_OF"
      comment: "Used at build time only; not distributed."
license_choices:
  # These crates offer a choice of licences; we take the permissive one Portitor itself uses.
  repository_license_choices:
    - given: "Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT"
      choice: "Apache-2.0"
      comment: "Offered by the wasi crate family; same licence as Portitor."
  package_license_choices:
    - package_id: "Crate::r-efi:5.3.0"
      license_choices:
        - given: "MIT OR Apache-2.0 OR LGPL-2.1-or-later"
          choice: "Apache-2.0"
          comment: >-
            getrandom 0.3 (through rand 0.9, which oxrdf uses) depends on r-efi only on UEFI
            targets, so it is never built into the images; if it were, we take Apache-2.0,
            the licence Portitor itself uses.

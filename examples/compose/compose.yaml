#
# Two Portitor participants and a data source, for trying Portitor out.
# Each participant is a connector and its identity component
# (portitor-identity). DSP requests are authenticated with DCP: the
# caller shows a MembershipCredential from a trusted issuer, here the data
# space's portitor-issuer (did:web:issuer%3A8070). Not a production setup:
# plain HTTP between the containers (PORTITOR_ALLOW_HTTP_CALLBACKS), and
# the issuer next to the participants. The issuer also serves the data
# space's HealthDCAT-AP demo bundle (scripts/demo-bundle.sh), which the
# provider pins and checks its datasets (../healthdcat-datasets.json)
# against.
#
#   scripts/demo-compose.sh
#
# writes the keys and secrets into run/, builds and signs the demo bundle
# into run/issuer/bundle/ (with the issuer image), starts everything, registers both
# participants at the issuer, has each identity ask it for its credentials
# and runs the demo checks (scripts/demo-steps.sh). KEEP=1 leaves it
# running: then use the consumer's management API on
# http://127.0.0.1:18091 (see the README), with the key in
# run/consumer/management.key, and negotiate with the provider at
# http://provider:8080/dsp/2025-1. The issuer's management API is on
# http://127.0.0.1:18071, with the key in run/issuer/management.key; the
# provider's (harvest jobs) on http://127.0.0.1:18081, with the key in
# run/provider/management.key.
# PORTITOR_IMAGE, PORTITOR_IDENTITY_IMAGE and PORTITOR_ISSUER_IMAGE pick
# other images, for example local builds.

name: portitor-demo

# shared by both participants
x-identity: &identity
  image: ${PORTITOR_IDENTITY_IMAGE:-ghcr.io/brunopacheco1/portitor-identity:0.7.0}
  depends_on: [issuer]
x-connector: &connector
  image: ${PORTITOR_IMAGE:-ghcr.io/brunopacheco1/portitor-connector:0.7.0}

services:
  # The data space's authority: did:web:issuer%3A8070, its issuer service
  # (credential requests, status lists) and its management API, where
  # scripts/demo-compose.sh registers the participants.
  issuer:
    image: ${PORTITOR_ISSUER_IMAGE:-ghcr.io/brunopacheco1/portitor-issuer:0.7.0}
    environment:
      PORTITOR_PARTICIPANT_ID: did:web:issuer%3A8070
      PORTITOR_ISSUER_SERVICE_URL: http://issuer:8070/issuer
      PORTITOR_ISSUER_KEY_FILE: /run/secrets/issuer-key
      # MembershipCredential (claims memberOf, role) and
      # DataProcessorCredential (claim processing)
      PORTITOR_ISSUER_CREDENTIALS_FILE: /config/issuer-credentials.json
      PORTITOR_MANAGEMENT_BIND: 0.0.0.0:8071
      PORTITOR_MANAGEMENT_API_KEY_FILE: /run/secrets/issuer-management-key
      PORTITOR_ALLOW_HTTP_CALLBACKS: "true"
      # the demo bundle: its public key in the DID document
      # (did:web:issuer%3A8070#bundle-key), the signed versions served at
      # http://issuer:8070/bundles/<version>/
      PORTITOR_ISSUER_BUNDLE_KEY_FILE: /config/bundle/bundle-key.jwk
      PORTITOR_ISSUER_BUNDLE_DIR: /config/bundle/bundles
    secrets:
      - issuer-key
      - issuer-management-key
    volumes:
      - ../issuer-credentials.json:/config/issuer-credentials.json:ro
      - ./run/issuer/bundle:/config/bundle:ro
      - issuer-data:/data
    ports:
      - 127.0.0.1:18071:8071 # management API

  # the provider's data: a plain web server with examples/data
  data:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    volumes:
      - ../data:/usr/share/nginx/html:ro

  # --- the provider ---------------------------------------------------------

  provider-identity:
    <<: *identity
    environment:
      # did:web:provider-identity%3A8090 is served at
      # http://provider-identity:8090/.well-known/did.json
      PORTITOR_PARTICIPANT_ID: did:web:provider-identity%3A8090
      PORTITOR_IDENTITY_KEY_FILE: /run/secrets/provider-identity-key
      PORTITOR_CREDENTIAL_SERVICE_URL: http://provider-identity:8090/cs
      PORTITOR_STS_CLIENT_SECRET_FILE: /run/secrets/provider-sts-secret
      PORTITOR_TRUSTED_ISSUERS: did:web:issuer%3A8070
      PORTITOR_MANAGEMENT_BIND: 0.0.0.0:8091
      PORTITOR_MANAGEMENT_API_KEY_FILE: /run/secrets/provider-identity-management-key
      PORTITOR_ALLOW_HTTP_CALLBACKS: "true"
    secrets:
      - provider-identity-key
      - provider-sts-secret
      - provider-identity-management-key
    volumes:
      - provider-identity-data:/data
    ports:
      - 127.0.0.1:18082:8090 # DID document, STS, credential service
      - 127.0.0.1:18083:8091 # management API

  provider:
    <<: *connector
    environment:
      # the connector is its identity's participant
      PORTITOR_PARTICIPANT_ID: did:web:provider-identity%3A8090
      PORTITOR_STS_URL: http://provider-identity:8090/sts/token
      PORTITOR_STS_CLIENT_SECRET_FILE: /run/secrets/provider-sts-secret
      PORTITOR_TRUSTED_ISSUERS: did:web:issuer%3A8070
      # where data addresses point: your app, on this machine, fetches the
      # data from there (the consumer reaches the provider as
      # http://provider:8080, the address given when negotiating)
      PORTITOR_PUBLIC_URL: http://127.0.0.1:18080
      # HealthDCAT-AP datasets, checked against the data space's bundle
      PORTITOR_DATASETS_FILE: /config/datasets.json
      PORTITOR_BUNDLE_URL: http://issuer:8070/bundles/r8-demo-1/
      PORTITOR_BUNDLE_VERSION: r8-demo-1
      PORTITOR_BUNDLE_AUTHORITY: did:web:issuer%3A8070
      # the offer for EU processors checks a DataProcessorCredential claim (ADR 0019)
      PORTITOR_POLICY_CREDENTIALS: DataProcessorCredential
      PORTITOR_ALLOW_HTTP_CALLBACKS: "true"
      # the harvest jobs (GET /v1/harvest-jobs)
      PORTITOR_MANAGEMENT_BIND: 0.0.0.0:8081
      PORTITOR_MANAGEMENT_API_KEY_FILE: /run/secrets/provider-management-key
    secrets:
      - provider-sts-secret
      - provider-management-key
    volumes:
      - ../healthdcat-datasets.json:/config/datasets.json:ro
      - provider-data:/data
    ports:
      - 127.0.0.1:18080:8080
      - 127.0.0.1:18081:8081
    depends_on: [provider-identity, data, issuer]
    # the bundle and the DID documents are read at start; until the issuer
    # and the identity answer, the start fails and is tried again
    restart: on-failure

  # --- the consumer ---------------------------------------------------------

  consumer-identity:
    <<: *identity
    environment:
      PORTITOR_PARTICIPANT_ID: did:web:consumer-identity%3A8090
      PORTITOR_IDENTITY_KEY_FILE: /run/secrets/consumer-identity-key
      PORTITOR_CREDENTIAL_SERVICE_URL: http://consumer-identity:8090/cs
      PORTITOR_STS_CLIENT_SECRET_FILE: /run/secrets/consumer-sts-secret
      PORTITOR_TRUSTED_ISSUERS: did:web:issuer%3A8070
      PORTITOR_MANAGEMENT_BIND: 0.0.0.0:8091
      PORTITOR_MANAGEMENT_API_KEY_FILE: /run/secrets/consumer-identity-management-key
      PORTITOR_ALLOW_HTTP_CALLBACKS: "true"
    secrets:
      - consumer-identity-key
      - consumer-sts-secret
      - consumer-identity-management-key
    volumes:
      - consumer-identity-data:/data
    ports:
      - 127.0.0.1:18092:8090 # credential service and STS
      - 127.0.0.1:18093:8091 # management API

  consumer:
    <<: *connector
    environment:
      PORTITOR_PARTICIPANT_ID: did:web:consumer-identity%3A8090
      PORTITOR_STS_URL: http://consumer-identity:8090/sts/token
      PORTITOR_STS_CLIENT_SECRET_FILE: /run/secrets/consumer-sts-secret
      PORTITOR_TRUSTED_ISSUERS: did:web:issuer%3A8070
      PORTITOR_PUBLIC_URL: http://consumer:8080
      PORTITOR_POLICY_CREDENTIALS: DataProcessorCredential
      PORTITOR_ALLOW_HTTP_CALLBACKS: "true"
      PORTITOR_MANAGEMENT_BIND: 0.0.0.0:8081
      PORTITOR_MANAGEMENT_API_KEY_FILE: /run/secrets/consumer-management-key
    secrets:
      - consumer-sts-secret
      - consumer-management-key
    volumes:
      - consumer-data:/data
    ports:
      - 127.0.0.1:18090:8080
      - 127.0.0.1:18091:8081
    depends_on: [consumer-identity]

# written by scripts/demo-compose.sh; the images run as user 65532, which
# must read them
secrets:
  issuer-key:
    file: ./run/issuer/issuer-key.pem
  issuer-management-key:
    file: ./run/issuer/management.key
  provider-identity-key:
    file: ./run/provider/identity-key.pem
  provider-sts-secret:
    file: ./run/provider/sts-client-secret
  provider-identity-management-key:
    file: ./run/provider/identity-management.key
  provider-management-key:
    file: ./run/provider/management.key
  consumer-identity-key:
    file: ./run/consumer/identity-key.pem
  consumer-sts-secret:
    file: ./run/consumer/sts-client-secret
  consumer-identity-management-key:
    file: ./run/consumer/identity-management.key
  consumer-management-key:
    file: ./run/consumer/management.key

volumes:
  issuer-data:
  provider-identity-data:
  provider-data:
  consumer-identity-data:
  consumer-data:

[package]
name = "portitor-identity"
description = "Portitor identity component: DID document, STS and credential service (Decentralized Claims Protocol 1.0)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
axum.workspace = true
portitor-dcp = { path = "../portitor-dcp" }
portitor-runtime = { path = "../portitor-runtime" }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
utoipa.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# For the test-only demo authority (examples/test-issuer, ADR 0015): the
# HTTP calls that deliver its credentials (hyper, http-body-util, as
# portitor-runtime uses them).
http-body-util.workspace = true
hyper.workspace = true

# The demo authority is an example, never part of the release binary or
# image; `test = true` runs its unit tests with `cargo test --workspace`.
[[example]]
name = "test-issuer"
path = "examples/test-issuer/main.rs"
test = true

[lints]
workspace = true

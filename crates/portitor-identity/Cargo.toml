[package]
name = "portitor-identity"
description = "Portitor identity component: DID document, STS and credential service (Decentralized Claims Protocol 1.0)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
axum.workspace = true
portitor-dcp = { path = "../portitor-dcp" }
portitor-runtime = { path = "../portitor-runtime" }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
utoipa.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
# Test settings for the DCP TCK. Test builds only; the release image is
# built without it. Nothing needs it yet: the TCK runs against the normal
# build (see .github/workflows/tck.yml).
tck = []

[lints]
workspace = true

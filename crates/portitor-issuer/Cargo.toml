[package]
name = "portitor-issuer"
description = "Portitor issuer component: issues and revokes credentials for a dataspace authority (Decentralized Claims Protocol 1.0)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
axum.workspace = true
portitor-dcp = { path = "../portitor-dcp" }
portitor-runtime = { path = "../portitor-runtime" }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# fs: serving bundle files (PORTITOR_ISSUER_BUNDLE_DIR)
tokio = { workspace = true, features = ["fs"] }
tracing.workspace = true
utoipa.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true

[package]
name = "portitor-runtime"
description = "Adapters shared by the Portitor binaries: outbound HTTP, did:web resolution, API keys, SQLite, logging, shutdown"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
axum.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-rustls.workspace = true
hyper-util.workspace = true
portitor-dcp = { path = "../portitor-dcp" }
ring.workspace = true
rusqlite.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# drives a router in memory in the serve.rs tests; already in the tree
# (axum, and the connector's and identity's tests)
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true

[package]
name = "portitor-connector"
description = "Portitor connector: Dataspace Protocol 2025-1 and Decentralized Claims Protocol 1.0"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
axum.workspace = true
portitor-dsp = { path = "../portitor-dsp" }
portitor-dps = { path = "../portitor-dps" }
http-body-util.workspace = true
hyper.workspace = true
hyper-rustls.workspace = true
hyper-util.workspace = true
ring.workspace = true
rusqlite.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa.workspace = true

[dev-dependencies]
jsonschema.workspace = true
tower = { version = "0.5", features = ["util"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
# Scripted provider and consumer behaviour for the DSP TCK. Test builds only;
# the release image is built without it.
tck = []

[lints]
workspace = true

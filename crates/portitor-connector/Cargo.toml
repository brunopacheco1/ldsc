[package]
name = "portitor-connector"
description = "Portitor connector: Dataspace Protocol 2025-1 and Decentralized Claims Protocol 1.0"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
axum.workspace = true
# base64url of the data plane's access tokens
base64.workspace = true
portitor-dcp = { path = "../portitor-dcp" }
portitor-dsp = { path = "../portitor-dsp" }
portitor-dps = { path = "../portitor-dps" }
portitor-runtime = { path = "../portitor-runtime" }
# the SHACL engine for the bundle's rules (ADR 0005)
portitor-shacl = { path = "../portitor-shacl" }
http-body-util.workspace = true
hyper.workspace = true
ring.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
utoipa.workspace = true

[dev-dependencies]
jsonschema.workspace = true
# builds and serves a signed bundle for the bundle tests (tests/bundle_source.rs,
# tests/bundle_cache.rs)
portitor-issuer = { path = "../portitor-issuer" }
tower = { version = "0.5", features = ["util"] }
# test-util: a paused clock for the harvest schedule test (src/harvest/tests.rs)
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
# reads the log lines a test expects (src/outbox.rs)
tracing-subscriber.workspace = true

[features]
default = ["data-plane"]
# The built-in HTTP pull data plane (ADR 0013). Without it the connector has
# no data plane and refuses every transfer request. Kept as a switch for a
# separate data plane process (later work).
data-plane = []
# Scripted provider and consumer behaviour for the DSP TCK. Test builds only;
# the release image is built without it.
tck = []

[lints]
workspace = true

# Licensing for files that cannot carry a comment header (https://reuse.software/spec-3.3/).
version = 1

[[annotations]]
path = [
    "Cargo.lock",
    "fuzz/Cargo.lock",
    "NOTICE",
    # test-only key material (binary DER, and PEM); never a real secret
    "crates/*/tests/fixtures/**",
    # JSON has no comments
    "examples/*.json",
    "examples/compose/*.json",
    # made-up demo data (CSV has no comments)
    "examples/data/*",
    "tck/*.json",
    # the EDC interop test's datasets (JSON) and made-up data (CSV)
    "interop/edc/config/*.json",
    "interop/edc/data/*",
    # Gradle dependency verification of the EDC runtimes, written by
    # Gradle (--write-verification-metadata), so no header
    "interop/edc/runtimes/gradle/verification-metadata.xml",
    "docs/api/*.json",
    # C4 diagrams: draw.io rewrites the whole .drawio.svg file on save
    "docs/diagrams/*.drawio.svg",
    # Bruno API client collection (.bru and bruno.json have no comment syntax we rely on)
    "_http/**",
    # VS Code configuration (JSON with comments)
    ".vscode/*.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Portitor contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
# JSON Schemas and examples copied unchanged from the Eclipse Dataspace Protocol, tag 2025-1-err2
path = ["crates/portitor-dsp/tests/schemas/*.json", "crates/portitor-dsp/tests/examples/**/*.json"]
precedence = "override"
SPDX-FileCopyrightText = "Eclipse Dataspace Protocol contributors (https://github.com/eclipse-dataspace-protocol-base/DataspaceProtocol)"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
# JSON Schemas and examples copied unchanged from the Eclipse Decentralized Claims Protocol, tag v1.0.1
path = ["crates/portitor-dcp/tests/schemas/*.json", "crates/portitor-dcp/tests/examples/*.json"]
precedence = "override"
SPDX-FileCopyrightText = "Eclipse Decentralized Claims Protocol contributors (https://github.com/eclipse-dataspace-dcp/decentralized-claims-protocol)"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
# JSON Schemas and examples copied unchanged from Eclipse Data Plane Signaling, tag v1.0-RC4
path = ["crates/portitor-dps/tests/schemas/*.json", "crates/portitor-dps/tests/examples/*.json"]
precedence = "override"
SPDX-FileCopyrightText = "Eclipse Data Plane Signaling contributors (https://github.com/eclipse-dataplane-signaling/dataplane-signaling)"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
# SHACL engine tests: datasets written for Portitor (JSON has no comments)
path = ["crates/portitor-shacl/tests/data/samples/*.jsonld", "crates/portitor-shacl/tests/data/spike/*.jsonld"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Portitor contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
# HealthDCAT-AP release 8 SHACL files, copied unchanged from
# https://data.health.europa.eu/healthdcat-ap/releases/release-8/html/shacl/HealthDCAT-AP_validator/config/rdf-validator/ehds/
# (shapes/, recommended/, ranges/, controlled-vocabularies/, imports/), fetched 2026-11-14
path = "crates/portitor-shacl/tests/data/healthdcat-ap-r8/*.ttl"
precedence = "override"
SPDX-FileCopyrightText = "European Union (HealthDCAT-AP, https://data.health.europa.eu/healthdcat-ap/releases/release-8/)"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
# DCAT-AP 3.0.0 SHACL files, copied unchanged from https://github.com/SEMICeu/DCAT-AP,
# releases/3.0.0/html/shacl/, commit 4470b8ea907b7eb9ec55ab22befd1ecd2210ff32
path = "crates/portitor-shacl/tests/data/dcat-ap-3.0.0/*.ttl"
precedence = "override"
SPDX-FileCopyrightText = "SEMIC, European Commission (DCAT-AP, https://github.com/SEMICeu/DCAT-AP)"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
# A few code-list triples (rdf:type, skos:inScheme) of the EU authority tables
# (https://op.europa.eu/en/web/eu-vocabularies) and the HealthDCAT-AP code lists
path = "crates/portitor-shacl/tests/data/samples/codelists-sample.nt"
precedence = "override"
SPDX-FileCopyrightText = "European Union"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
# DSP 2025-1 JSON-LD contexts, copied unchanged from the Eclipse Dataspace Protocol, tag 2025-1

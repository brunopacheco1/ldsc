# Licensing for files that cannot carry a comment header (https://reuse.software/spec-3.3/).
version = 1

[[annotations]]
path = [
    "Cargo.lock",
    "fuzz/Cargo.lock",
    "NOTICE",
    # test-only key material in binary form
    "crates/*/tests/fixtures/**",
    # JSON has no comments
    "examples/*.json",
    "tck/*.json",
    "docs/api/*.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "LDSC contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
# JSON Schemas and examples copied unchanged from the Eclipse Dataspace Protocol, tag 2025-1-err2
path = ["crates/ldsc-dsp/tests/schemas/*.json", "crates/ldsc-dsp/tests/examples/**/*.json"]
precedence = "override"
SPDX-FileCopyrightText = "Eclipse Dataspace Protocol contributors (https://github.com/eclipse-dataspace-protocol-base/DataspaceProtocol)"
SPDX-License-Identifier = "Apache-2.0"

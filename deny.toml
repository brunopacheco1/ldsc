# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/).

[graph]
all-features = true

[advisories]
# RustSec advisories: vulnerable, unmaintained, unsound or yanked crates fail the check
yanked = "deny"

[licenses]
# Permissive licences compatible with distributing LDSC under Apache-2.0.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
]
confidence-threshold = 0.9
# the allowlist is a policy, not an inventory: unused entries are fine
unused-allowed-license = "allow"

[licenses.private]
# our own crates are covered by the REUSE check
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# workspace path dependencies have no version; that is fine
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

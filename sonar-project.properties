# SonarQube Cloud (CI-based analysis; Rust needs it)
sonar.organization=brunopacheco1-github
sonar.projectKey=brunopacheco1_portitor
sonar.projectName=Portitor
sonar.sources=crates,scripts
sonar.tests=crates
sonar.test.inclusions=crates/*/tests/**
sonar.exclusions=crates/*/tests/**
# reports written by the CI job before the scan
sonar.rust.clippyReport.reportPaths=clippy-report.json
sonar.rust.lcov.reportPaths=lcov.info
# CI helper scripts are analysed for bugs and security, but not measured for coverage:
# they run in CI, not in the shipped images.
sonar.coverage.exclusions=scripts/**
# S5332 (clear-text HTTP): the scripts only talk to processes they start themselves on
# 127.0.0.1 or a private Docker network (demos, measurements, the EDC interop test), and
# did:web over plain HTTP needs PORTITOR_ALLOW_HTTP_CALLBACKS, a test-only setting.
# The shipped binaries are still checked for this rule.
sonar.issue.ignore.multicriteria=localhttp
sonar.issue.ignore.multicriteria.localhttp.ruleKey=shell:S5332
sonar.issue.ignore.multicriteria.localhttp.resourceKey=scripts/**

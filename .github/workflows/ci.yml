name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.97.0"
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -c clippy,rustfmt -t x86_64-unknown-linux-musl
          rustup default "$RUST_TOOLCHAIN"
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy -p ldsc-connector --features tck --all-targets --locked -- -D warnings
      - name: Test
        run: |
          cargo test --workspace --locked
          # the TCK scripts (test-only feature, never in a release build)
          cargo test -p ldsc-connector --features tck --locked
      - name: Domain crates have no I/O dependencies (ADR 0004)
        run: |
          for c in ldsc-dsp ldsc-dcp; do
            if cargo tree -p "$c" -e normal --prefix none | grep -E '^(axum|hyper|tokio|sqlx|reqwest) '; then
              echo "::error::$c depends on an I/O crate"; exit 1
            fi
          done
      - name: Build static binary
        run: |
          start=$(date +%s)
          cargo build --release --locked --target x86_64-unknown-linux-musl -p ldsc-connector
          echo "release build seconds (with cache): $(( $(date +%s) - start ))" >> "$GITHUB_STEP_SUMMARY"
      - name: Build image
        run: |
          mkdir -p dist/amd64 && cp target/x86_64-unknown-linux-musl/release/ldsc-connector dist/amd64/
          docker build -t ldsc-connector:ci .
          # https callbacks need the CA bundle in the image
          id=$(docker create ldsc-connector:ci)
          docker cp "$id:/etc/ssl/certs/ca-certificates.crt" ca.crt
          docker rm "$id"
          grep -q "BEGIN CERTIFICATE" ca.crt
          # the non-root user can create the SQLite file in /data
          docker run -d --name smoke -p 8080:8080 ldsc-connector:ci
          for _ in $(seq 50); do curl -sf http://127.0.0.1:8080/health && break; sleep 0.2; done
          curl -sf http://127.0.0.1:8080/health
          docker logs smoke
          docker rm -f smoke
          docker image inspect ldsc-connector:ci --format 'image bytes: {{.Size}}' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ldsc-connector-musl
          path: target/x86_64-unknown-linux-musl/release/ldsc-connector
          retention-days: 7

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-24.04
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for blame data
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -c clippy,llvm-tools-preview
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov
      - name: Coverage (LCOV) and Clippy report (JSON)
        run: |
          cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
          cargo clippy --workspace --all-targets --locked --message-format=json > clippy-report.json
      # Mandatory once SONAR_TOKEN is set: the scan waits for the quality gate and fails this job
      # if the gate fails. GitHub gives no secrets to pull requests from forks, so those are skipped.
      - name: Scan and wait for the quality gate
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600
      - name: SonarQube Cloud skipped (no token)
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "::warning title=SonarQube Cloud not run::SONAR_TOKEN is not set (not configured yet, or a pull request from a fork)."

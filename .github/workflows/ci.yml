name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.97.0"
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -c clippy,rustfmt -t x86_64-unknown-linux-musl
          rustup default "$RUST_TOOLCHAIN"
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy -p portitor-connector --features tck --all-targets --locked -- -D warnings
      - name: Test
        run: |
          cargo test --workspace --locked
          # the TCK scripts (test-only feature, never in a release build)
          cargo test -p portitor-connector --features tck --locked
      - name: Domain crates have no I/O dependencies (ADR 0004)
        run: |
          # web servers and clients, async I/O, databases, TLS
          io='axum|hyper|hyper-util|hyper-rustls|tokio|mio|socket2|reqwest|ureq|rusqlite|libsqlite3-sys|sqlx|postgres|rustls'
          for c in portitor-dsp portitor-dcp portitor-dps portitor-time portitor-shacl; do
            if cargo tree -p "$c" -e normal --prefix none | grep -E "^($io) "; then
              echo "::error::$c depends on an I/O crate"; exit 1
            fi
          done
      - name: Documentation matches the code (C4 diagrams, OpenAPI versions)
        run: python3 scripts/check_docs.py
      - name: Build static binaries
        run: |
          start=$(date +%s)
          cargo build --release --locked --target x86_64-unknown-linux-musl -p portitor-connector -p portitor-identity \
            -p portitor-issuer
          echo "release build seconds (with cache): $(( $(date +%s) - start ))" >> "$GITHUB_STEP_SUMMARY"
      - name: Two participants get their credentials from the issuer, agree contracts and transfer a file
        run: |
          scripts/demo.sh target/x86_64-unknown-linux-musl/release/portitor-connector \
            target/x86_64-unknown-linux-musl/release/portitor-identity \
            target/x86_64-unknown-linux-musl/release/portitor-issuer
      - name: Build images
        run: |
          mkdir -p dist/amd64
          cp target/x86_64-unknown-linux-musl/release/portitor-{connector,identity,issuer} dist/amd64/
          docker build --target portitor-connector -t portitor-connector:ci .
          docker build --target portitor-identity -t portitor-identity:ci .
          docker build --target portitor-issuer -t portitor-issuer:ci .
          docker image inspect portitor-identity:ci --format 'identity image bytes: {{.Size}}' >> "$GITHUB_STEP_SUMMARY"
          docker image inspect portitor-issuer:ci --format 'issuer image bytes: {{.Size}}' >> "$GITHUB_STEP_SUMMARY"
      - name: Connector image (CA bundle, refuses to start without DCP)
        run: |
          # https callbacks need the CA bundle in the image
          id=$(docker create portitor-connector:ci)
          docker cp "$id:/etc/ssl/certs/ca-certificates.crt" ca.crt
          docker rm "$id"
          grep -q "BEGIN CERTIFICATE" ca.crt
          # without the DCP settings it refuses to start, and says why (it
          # starts, and writes its SQLite file in /data, in the Compose demo)
          if docker run --rm portitor-connector:ci > smoke.log 2>&1; then
            echo "::error::the connector started without PORTITOR_STS_URL"; exit 1
          fi
          cat smoke.log
          grep -q PORTITOR_STS_URL smoke.log
          docker image inspect portitor-connector:ci --format 'connector image bytes: {{.Size}}' >> "$GITHUB_STEP_SUMMARY"
      - name: Identity image starts
        run: |
          # the key and the STS secret as read-only files, as in docs/DEPLOYING.md;
          # readable by the image's user 65532
          mkdir -p identity-secrets
          openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out identity-secrets/identity-key.pem
          openssl rand -hex 32 > identity-secrets/sts-client-secret
          chmod 644 identity-secrets/*
          docker run -d --name smoke-identity -p 8090:8090 \
            -v "$PWD/identity-secrets:/run/secrets/portitor:ro" \
            -e PORTITOR_PARTICIPANT_ID=did:web:localhost%3A8090 \
            -e PORTITOR_IDENTITY_KEY_FILE=/run/secrets/portitor/identity-key.pem \
            -e PORTITOR_CREDENTIAL_SERVICE_URL=http://localhost:8090 \
            -e PORTITOR_STS_CLIENT_SECRET_FILE=/run/secrets/portitor/sts-client-secret \
            -e PORTITOR_TRUSTED_ISSUERS=did:web:issuer.example \
            -e PORTITOR_ALLOW_HTTP_CALLBACKS=true \
            portitor-identity:ci
          # did:web:localhost%3A8090 resolves to http://localhost:8090/.well-known/did.json
          for _ in $(seq 50); do curl -sf http://127.0.0.1:8090/.well-known/did.json > did.json && break; sleep 0.2; done
          docker logs smoke-identity
          jq -e '.id == "did:web:localhost%3A8090"' did.json
          # the non-root user created the SQLite file in /data
          docker cp smoke-identity:/data/portitor-identity.db - > /dev/null
          docker rm -f smoke-identity
      - name: Issuer image refuses to start without its settings
        run: |
          if docker run --rm portitor-issuer:ci > issuer-smoke.log 2>&1; then
            echo "::error::the issuer started without its settings"; exit 1
          fi
          cat issuer-smoke.log
      - name: The same in Docker Compose
        run: scripts/demo-compose.sh portitor-connector:ci portitor-identity:ci portitor-issuer:ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portitor-musl
          path: |
            target/x86_64-unknown-linux-musl/release/portitor-connector
            target/x86_64-unknown-linux-musl/release/portitor-identity
            target/x86_64-unknown-linux-musl/release/portitor-issuer
          retention-days: 7

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-24.04
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for blame data
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -c clippy,llvm-tools-preview
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov
      - name: Coverage (LCOV) and Clippy report (JSON)
        run: |
          cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
          cargo clippy --workspace --all-targets --locked --message-format=json > clippy-report.json
      # Mandatory once SONAR_TOKEN is set: the scan waits for the quality gate and fails this job
      # if the gate fails. GitHub gives no secrets to pull requests from forks, so those are skipped.
      - name: Scan and wait for the quality gate
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600
      - name: SonarQube Cloud skipped (no token)
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "::warning title=SonarQube Cloud not run::SONAR_TOKEN is not set (not configured yet, or a pull request from a fork)."

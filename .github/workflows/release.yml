name: Release
# Pushing a signed tag vX.Y.Z publishes the component images to GHCR, signed, with an SBOM and
# build provenance, and creates a GitHub release. Owner setup and the steps: docs/RELEASING.md.
on:
  push:
    tags: ['v*']
  # a dry run (build, SBOM, image; nothing pushed or signed) when the release process changes
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'scripts/third_party_notices.py'

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_TOOLCHAIN: "1.97.0"
  CARGO_TERM_COLOR: always
  # One entry per image (ADR 0003), and a build target of the same name in the Dockerfile.
  # portitor-issuer joins in 0.6.
  COMPONENTS: portitor-connector portitor-identity

jobs:
  verify:
    name: Check the tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.tag.outputs.version || steps.cargo.outputs.version }}
      # COMPONENTS as a JSON list, for the image jobs' matrix (a matrix cannot read env)
      components: ${{ steps.components.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Component list
        id: components
        run: echo "list=$(jq -cn --arg c "$COMPONENTS" '$c | split(" ")')" >> "$GITHUB_OUTPUT"
      - name: Version from Cargo.toml (dry run)
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          VERSION=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        id: cargo
      - name: Tag is signed, matches Cargo.toml and CHANGELOG.md
        if: ${{ github.event_name == 'push' }}
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error::Tag $TAG is not vMAJOR.MINOR.PATCH"; exit 1
          fi
          VERSION="${BASH_REMATCH[1]}"
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          if [ "$(git cat-file -t "$TAG")" != tag ]; then
            echo "::error::$TAG is a lightweight tag; create it with git tag -s"; exit 1
          fi
          # the maintainer's public keys, as published by GitHub (HTTPS only, redirects included)
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSL "https://github.com/${GITHUB_REPOSITORY_OWNER}.gpg" | gpg --import
          git verify-tag "$TAG"
          CARGO_VERSION=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "::error::Cargo.toml has version $CARGO_VERSION, the tag says $VERSION"; exit 1
          fi
          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' section"; exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build:
    name: Build and test (${{ matrix.arch }})
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -t "${{ matrix.target }}"
          rustup default "$RUST_TOOLCHAIN"
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - name: Test
        run: cargo test --workspace --locked
      - name: Build static binaries
        run: |
          for c in $COMPONENTS; do
            cargo build --release --locked --target "${{ matrix.target }}" -p "$c"
            mkdir -p "dist/${{ matrix.arch }}"
            cp "target/${{ matrix.target }}/release/$c" "dist/${{ matrix.arch }}/"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.arch }}
          path: dist/${{ matrix.arch }}/
          retention-days: 7

  sbom:
    name: SBOMs and third-party notices
    needs: verify
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-cyclonedx
      - name: One CycloneDX SBOM per component, and the notices for all of them
        run: |
          cargo cyclonedx --format json --describe binaries --target x86_64-unknown-linux-musl
          mkdir sbom
          boms=()
          for c in $COMPONENTS; do
            cp "crates/$c/${c}_bin.cdx.json" "sbom/$c-$VERSION.cdx.json"
            boms+=("sbom/$c-$VERSION.cdx.json")
          done
          python3 scripts/third_party_notices.py "$VERSION" "${boms[@]}" > sbom/THIRD-PARTY-NOTICES.txt
          wc -l sbom/THIRD-PARTY-NOTICES.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/
          retention-days: 7

  dry-run:
    name: Image dry run, ${{ matrix.component }} (nothing pushed)
    if: ${{ github.event_name == 'pull_request' }}
    needs: [verify, build]
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.verify.outputs.components) }}
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
      - name: Arrange binaries by architecture
        run: |
          for a in amd64 arm64; do mv "dist/dist-$a" "dist/$a"; done
          chmod +x dist/*/*
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build ${{ matrix.component }} (amd64, arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=${{ env.VERSION }}
            REVISION=${{ github.sha }}

  images:
    name: Publish ${{ matrix.component }}
    if: ${{ github.event_name == 'push' }}
    needs: [verify, build, sbom]
    strategy:
      # let each image finish (pushed, signed, attested) even if the other fails;
      # the GitHub release is only created when all of them succeeded
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.verify.outputs.components) }}
    runs-on: ubuntu-24.04
    # only these jobs can push and sign; the environment can require the maintainer's approval
    # (one approval covers all images of a run: "Review deployments" lists them together)
    environment: release
    permissions:
      packages: write # push to GHCR
      id-token: write # keyless signing and attestations
      attestations: write # store provenance and SBOM attestations
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      COMPONENT: ${{ matrix.component }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.component }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
      - name: Arrange binaries by architecture
        run: |
          for a in amd64 arm64; do mv "dist/dist-$a" "dist/$a"; done
          chmod +x dist/*/*
          ls -lR dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Image creation time and description
        id: meta
        run: |
          # the tagged commit's time, so rebuilds match
          echo "time=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"
          # the description label of this component's target in the Dockerfile, so it is written once
          description=$(sed -n "/^FROM base AS ${COMPONENT}\$/,/^ENTRYPOINT/s/.*image\.description=\"\(.*\)\"\$/\1/p" Dockerfile)
          if [ -z "$description" ]; then
            echo "::error::No image.description label for target $COMPONENT in the Dockerfile"; exit 1
          fi
          echo "description=$description" >> "$GITHUB_OUTPUT"
      - name: Build and push ${{ matrix.component }} (amd64, arm64)
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false # provenance is attested below, signed by GitHub
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          # the OCI labels live in the Dockerfile; these fill in the per-release values
          build-args: |
            VERSION=${{ env.VERSION }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.meta.outputs.time }}
          # the same keys on the multi-arch index, which registries such as GHCR display
          annotations: |
            index:org.opencontainers.image.title=${{ matrix.component }}
            index:org.opencontainers.image.description=${{ steps.meta.outputs.description }}
            index:org.opencontainers.image.licenses=Apache-2.0
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.version=${{ env.VERSION }}
            index:org.opencontainers.image.revision=${{ github.sha }}
            index:org.opencontainers.image.created=${{ steps.meta.outputs.time }}
      - name: Sign the image (cosign, keyless)
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: SBOM attestation
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: sbom/${{ matrix.component }}-${{ env.VERSION }}.cdx.json
          push-to-registry: true
      - name: Keep the digest and the provenance bundle for the release
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          mkdir image
          echo "$DIGEST" > "image/$COMPONENT.digest"
          # the signed provenance bundle (Sigstore, SLSA v1), so it can be verified offline and found
          # by tools such as the OpenSSF Scorecard
          cp "$BUNDLE" "image/$COMPONENT-$VERSION.intoto.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.component }}
          path: image/
          retention-days: 7

  release:
    name: GitHub release
    if: ${{ github.event_name == 'push' }}
    # runs only after every image was pushed, signed and attested (and so approved in `release`)
    needs: [verify, build, sbom, images]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the GitHub release
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: image
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # release notes: this version's section of the changelog, then the images
          awk -v v="## [${VERSION}]" 'index($0, v) == 1 {on = 1; next} /^## \[/ || /^\[[^]]*\]: / {on = 0} on' CHANGELOG.md > notes.md
          {
            echo
            echo "Images:"
            for c in $COMPONENTS; do
              echo "- \`ghcr.io/${GITHUB_REPOSITORY_OWNER}/$c:${VERSION}\` (\`$(cat "image/$c.digest")\`)"
            done
            echo
            echo "Verify them as described in docs/RELEASING.md."
          } >> notes.md
          files=(sbom/THIRD-PARTY-NOTICES.txt)
          for a in amd64 arm64; do
            for c in $COMPONENTS; do
              cp "dist/dist-$a/$c" "$c-$VERSION-linux-$a"
              files+=("$c-$VERSION-linux-$a")
            done
          done
          for c in $COMPONENTS; do
            files+=("sbom/$c-$VERSION.cdx.json" "image/$c-$VERSION.intoto.jsonl")
          done
          gh release create "${GITHUB_REF_NAME}" --verify-tag --title "Portitor ${VERSION}" \
            --notes-file notes.md "${files[@]}"

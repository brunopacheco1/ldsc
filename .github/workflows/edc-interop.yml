# The EDC interop test (docs/TESTING.md): Portitor (connector and identity)
# against EDC v1.0.0-RC7 (control plane, data plane, IdentityHub); both
# ask portitor-issuer for their MembershipCredential. Catalog, negotiation
# and pull transfer both ways, then revocation both ways. The EDC runtimes are
# built from Maven Central (interop/edc/runtimes); there are no EDC images.
name: EDC interop
on:
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.lock"
      - "Dockerfile"
      - "interop/edc/**"
      - "scripts/edc-interop.sh"
      - ".github/workflows/edc-interop.yml"
  schedule:
    - cron: "37 2 * * *" # nightly: EDC's side changes without our code changing
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.97.0"
  CARGO_TERM_COLOR: always

jobs:
  edc:
    name: Portitor and EDC
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -t x86_64-unknown-linux-musl
          rustup default "$RUST_TOOLCHAIN"
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build the Portitor images (as CI does)
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl -p portitor-connector -p portitor-identity \
            -p portitor-issuer
          mkdir -p dist/amd64
          cp target/x86_64-unknown-linux-musl/release/portitor-{connector,identity,issuer} dist/amd64/
          docker build --target portitor-connector -t portitor-connector:ci .
          docker build --target portitor-identity -t portitor-identity:ci .
          docker build --target portitor-issuer -t portitor-issuer:ci .
      - name: Run the interop test
        env:
          LOGS: edc-interop.log
        run: scripts/edc-interop.sh
      - name: Keep the container logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: edc-interop-logs
          path: edc-interop.log
          if-no-files-found: ignore
          retention-days: 7

[workspace]
resolver = "3"
members = ["crates/portitor-dsp", "crates/portitor-dcp", "crates/portitor-dps", "crates/portitor-connector"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/brunopacheco1/portitor"
rust-version = "1.89"

[workspace.dependencies]
axum = "0.8"
# no default features: the default "simd-unsafe" feature (0.23) runs unsafe SIMD code we do not need
base64 = { version = "0.23", default-features = false, features = ["std"] }
jsonschema = { version = "0.61", default-features = false }
# DEFLATE for DCP status lists; no unsafe code (forbid(unsafe_code)), and without its
# "simd" feature (unsafe SIMD checksums), which flate2 would force on
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }
# HTTP client for DSP callbacks, on the hyper stack axum already uses. TLS is rustls with
# the ring provider (already used for JOSE) and the system's CA certificates; no aws-lc-rs,
# no bundled root store, no proxy support (which would pull base64's unsafe SIMD).
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "ring", "native-tokio", "logging"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "tokio"] }
ring = "0.17"
# SQLite compiled in (bundled), so the static musl binary needs no system library
rusqlite = { version = "0.42", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# OpenAPI description of the management API, generated from the handlers at compile time
utoipa = { version = "6", default-features = false, features = ["macros"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

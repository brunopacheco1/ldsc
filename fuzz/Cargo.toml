# Fuzz targets (cargo-fuzz, run by ClusterFuzzLite). Not a workspace member:
# it needs a nightly toolchain and libFuzzer.
[package]
name = "ldsc-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ldsc-dcp = { path = "../crates/ldsc-dcp" }
ldsc-dsp = { path = "../crates/ldsc-dsp" }
serde = "1"
serde_json = "1"

[workspace]

[[bin]]
name = "dsp_messages"
path = "fuzz_targets/dsp_messages.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dcp_token_parse"
path = "fuzz_targets/dcp_token_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dcp_token_validate"
path = "fuzz_targets/dcp_token_validate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dsp_negotiation"
path = "fuzz_targets/dsp_negotiation.rs"
test = false
doc = false
bench = false

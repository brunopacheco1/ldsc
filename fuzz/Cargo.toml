# Fuzz targets (cargo-fuzz, run by ClusterFuzzLite). Not a workspace member:
# it needs a nightly toolchain and libFuzzer.
[package]
name = "portitor-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
portitor-dcp = { path = "../crates/portitor-dcp" }
portitor-dsp = { path = "../crates/portitor-dsp" }
serde = "1"
serde_json = "1"

[workspace]

[[bin]]
name = "dsp_messages"
path = "fuzz_targets/dsp_messages.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dcp_token_parse"
path = "fuzz_targets/dcp_token_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dcp_token_validate"
path = "fuzz_targets/dcp_token_validate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dsp_negotiation"
path = "fuzz_targets/dsp_negotiation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dsp_transfer"
path = "fuzz_targets/dsp_transfer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "odrl_policy"
path = "fuzz_targets/odrl_policy.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dcp_status_list"
path = "fuzz_targets/dcp_status_list.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dcp_messages"
path = "fuzz_targets/dcp_messages.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dcp_credentials"
path = "fuzz_targets/dcp_credentials.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dcp_access_token"
path = "fuzz_targets/dcp_access_token.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dcp_did_document"
path = "fuzz_targets/dcp_did_document.rs"
test = false
doc = false
bench = false

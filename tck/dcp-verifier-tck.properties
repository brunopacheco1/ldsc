# DCP TCK v1.2.1 configuration: the verifier tests against the connector
# (ADR 0016). The TCK plays the prover (holder) and the issuer and serves
# their DIDs itself at the callback address (did:web:127.0.0.1%3A8083:holder,
# ...:issuer). It triggers each test with a catalog request carrying the
# holder's ID token; 2xx means the connector accepted the caller, 4xx that it
# refused. The verifier is the connector's own identity, a portitor-identity
# at localhost:8090: the TCK checks the connector's tokens against it.
dataspacetck.debug=false
dataspacetck.ansi=false
dataspacetck.host=127.0.0.1
dataspacetck.port=8083
dataspacetck.callback.address=http://127.0.0.1:8083
dataspacetck.test.package=org.eclipse.dataspacetck.dcp.verification.presentation.verifier
dataspacetck.did.verifier=did:web:localhost%3A8090
dataspacetck.vpp.trigger.endpoint=http://127.0.0.1:8080/dsp/2025-1/catalog/request

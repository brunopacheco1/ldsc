# DCP TCK v1.2.1 configuration: the credential service tests (presentation
# and holder-side issuance) against portitor-identity. The TCK plays the
# verifier and the issuer; its DIDs are served by the TCK itself at the
# callback address (did:web:127.0.0.1%3A8083:issuer, ...:verifier, ...).
# Before the run, the issuer must be trusted (PORTITOR_TRUSTED_ISSUERS) and
# a credential request with the correlation id below must exist (management
# API, POST /v1/credential-requests), so the Storage API accepts the test
# credentials the TCK delivers before each test.
dataspacetck.debug=false
dataspacetck.ansi=false
dataspacetck.host=127.0.0.1
dataspacetck.port=8083
dataspacetck.callback.address=http://127.0.0.1:8083
dataspacetck.test.package=org.eclipse.dataspacetck.dcp.verification.presentation.cs,org.eclipse.dataspacetck.dcp.verification.issuance.cs
dataspacetck.did.holder=did:web:localhost%3A8090
dataspacetck.sts.url=http://localhost:8090/sts
dataspacetck.sts.client.id=did:web:localhost%3A8090
dataspacetck.credentials.correlation.id=portitor-dcp-tck
# dataspacetck.sts.client.secret comes from the environment
# (DATASPACETCK_STS_CLIENT_SECRET), the same value as the file in
# PORTITOR_STS_CLIENT_SECRET_FILE

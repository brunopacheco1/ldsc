# DCP TCK v1.2.1 configuration: the credential service tests (presentation
# and holder-side issuance) against portitor-identity. The TCK plays the
# verifier and the issuer; its DIDs are served by the TCK itself at the
# callback address (did:web:127.0.0.1%3A8083:issuer, ...:verifier, ...).
# Before the run, the issuer must be trusted (PORTITOR_TRUSTED_ISSUERS) and
# a credential request must exist for each correlation id below (management
# API, POST /v1/credential-requests), so the Storage API accepts the test
# credentials the TCK delivers. A delivery closes its request (ADR 0015), so
# every test that delivers successfully gets its own id
# (dataspacetck.credentials.correlation.id.<test method>, TCK v1.2.1); the
# run-wide id serves the tests whose deliveries are refused.
dataspacetck.debug=false
dataspacetck.ansi=false
dataspacetck.host=127.0.0.1
dataspacetck.port=8083
dataspacetck.callback.address=http://127.0.0.1:8083
dataspacetck.test.package=org.eclipse.dataspacetck.dcp.verification.presentation.cs,org.eclipse.dataspacetck.dcp.verification.issuance.cs
dataspacetck.did.holder=did:web:localhost%3A8090
dataspacetck.sts.url=http://localhost:8090/sts
dataspacetck.sts.client.id=did:web:localhost%3A8090
dataspacetck.credentials.correlation.id=portitor-dcp-tck
dataspacetck.credentials.correlation.id.cs_04_03_03_idTokenInvalidIssuerSub=portitor-dcp-tck-cs_04_03_03_idTokenInvalidIssuerSub
dataspacetck.credentials.correlation.id.cs_04_03_03_idTokenInvalidSub=portitor-dcp-tck-cs_04_03_03_idTokenInvalidSub
dataspacetck.credentials.correlation.id.cs_04_03_03_idtokenIncorrectAud=portitor-dcp-tck-cs_04_03_03_idtokenIncorrectAud
dataspacetck.credentials.correlation.id.cs_04_03_03_idtokenIncorrectSub=portitor-dcp-tck-cs_04_03_03_idtokenIncorrectSub
dataspacetck.credentials.correlation.id.cs_04_03_03_idtokenNbfInFuture=portitor-dcp-tck-cs_04_03_03_idtokenNbfInFuture
dataspacetck.credentials.correlation.id.cs_04_03_03_idtokenExpired=portitor-dcp-tck-cs_04_03_03_idtokenExpired
dataspacetck.credentials.correlation.id.cs_04_03_03_idtokenJtiUsedTwice=portitor-dcp-tck-cs_04_03_03_idtokenJtiUsedTwice
dataspacetck.credentials.correlation.id.cs_04_03_03_idTokenKidNoCapabilityInvocation=portitor-dcp-tck-cs_04_03_03_idTokenKidNoCapabilityInvocation
dataspacetck.credentials.correlation.id.cs_04_03_03_idTokenNoKidMultipleVms=portitor-dcp-tck-cs_04_03_03_idTokenNoKidMultipleVms
dataspacetck.credentials.correlation.id.cs_05_03_01_accessTokenInvalidHeader=portitor-dcp-tck-cs_05_03_01_accessTokenInvalidHeader
dataspacetck.credentials.correlation.id.cs_05_04_invalidTokenNotAuthorized=portitor-dcp-tck-cs_05_04_invalidTokenNotAuthorized
dataspacetck.credentials.correlation.id.cs_05_04_01_invalidScopeAndPresentationRequest=portitor-dcp-tck-cs_05_04_01_invalidScopeAndPresentationRequest
dataspacetck.credentials.correlation.id.cs_05_04_01_emptyPresentationDefinition=portitor-dcp-tck-cs_05_04_01_emptyPresentationDefinition
dataspacetck.credentials.correlation.id.cs_05_04_02_emptyScopeExpect4xx=portitor-dcp-tck-cs_05_04_02_emptyScopeExpect4xx
dataspacetck.credentials.correlation.id.cs_05_04_01_02_scopeByTypeRequest=portitor-dcp-tck-cs_05_04_01_02_scopeByTypeRequest
dataspacetck.credentials.correlation.id.cs_05_04_01_02_lessScopesThanAuthorizedByTypeRequest=portitor-dcp-tck-cs_05_04_01_02_lessScopesThanAuthorizedByTypeRequest
dataspacetck.credentials.correlation.id.cs_05_04_01_02_invalidScopeEscalationRequest=portitor-dcp-tck-cs_05_04_01_02_invalidScopeEscalationRequest
dataspacetck.credentials.correlation.id.cs_06_05_01_credentialMessage=portitor-dcp-tck-cs_06_05_01_credentialMessage
dataspacetck.credentials.correlation.id.cs_06_05_01_credentialMessage_jtiAlreadyUsed=portitor-dcp-tck-cs_06_05_01_credentialMessage_jtiAlreadyUsed
dataspacetck.credentials.correlation.id.cs_06_05_01_credentialMessage_emptyCredentials=portitor-dcp-tck-cs_06_05_01_credentialMessage_emptyCredentials
# dataspacetck.sts.client.secret comes from the environment
# (DATASPACETCK_STS_CLIENT_SECRET), the same value as the file in
# PORTITOR_STS_CLIENT_SECRET_FILE

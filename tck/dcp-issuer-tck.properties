# DCP TCK v1.2.1 configuration: the issuer tests (package issuance.issuer,
# 41 tests) against portitor-issuer (scripts/dcp-issuer-tck.sh). The TCK
# plays the holder: its DID (did:web:127.0.0.1%3A8083:holder) and its
# credential service are served by the TCK itself at the callback address,
# and it must be registered as a participant before the run (management
# API, POST /v1/participants), since the issuer issues to registered
# participants only (ADR 0018). The TCK asks for every credential of
# profile vc11-sl2021/jwt in the metadata; tck/issuer-credentials.json
# defines two, as its test 6.4.1 expects two credentials.
#
# The issuer refuses a second request with the same holderPid from the
# same holder (409, ADR 0018), so every test whose request must be
# accepted gets its own holderPid
# (dataspacetck.credentials.correlation.id.<test method>, TCK v1.2.1); the
# run-wide id serves the tests whose requests are refused before that
# check. The holderPids are kept in the issuer's database, so each run
# starts with a new one.
dataspacetck.debug=false
dataspacetck.ansi=false
dataspacetck.host=127.0.0.1
dataspacetck.port=8083
dataspacetck.callback.address=http://127.0.0.1:8083
dataspacetck.test.package=org.eclipse.dataspacetck.dcp.verification.issuance.issuer
dataspacetck.did.issuer=did:web:localhost%3A8070
dataspacetck.credentials.correlation.id=portitor-issuer-tck
dataspacetck.credentials.correlation.id.is_6_4_1_credentialRequest=portitor-issuer-tck-is_6_4_1_credentialRequest

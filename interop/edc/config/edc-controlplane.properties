#
# EDC control plane (v1.0.0-RC7) of the EDC interop test. Test-only:
# plain HTTP, a dev Vault, a fixed management API key.

# the participant: its DID is hosted by the EDC IdentityHub
edc.participant.id=did:web:edc-identityhub%3A7083:edc
edc.iam.issuer.id=did:web:edc-identityhub%3A7083:edc
edc.iam.did.web.use.https=false

# tokens come from the IdentityHub's STS; the IdentityHub keeps the client
# secret in the shared Vault when it creates the participant
edc.iam.sts.oauth.token.url=http://edc-identityhub:7084/api/sts/token
edc.iam.sts.oauth.client.id=did:web:edc-identityhub%3A7083:edc
edc.iam.sts.oauth.client.secret.alias=edc-sts-client-secret
edc.vault.hashicorp.url=http://vault:8200
edc.vault.hashicorp.token=root

web.http.port=8080
web.http.path=/api
web.http.management.port=8081
web.http.management.path=/api/management
web.http.management.auth.type=tokenbased
web.http.management.auth.key=edc-interop-test-key
web.http.protocol.port=8082
web.http.protocol.path=/api/dsp
web.http.control.port=8083
web.http.control.path=/api/control
web.http.signaling.port=8084
web.http.signaling.path=/api/signaling
edc.dsp.callback.address=http://edc-controlplane:8082/api/dsp

# The scope EDC asks a counter-party's credential service for, and puts in
# its own access tokens. Set explicitly: EDC IdentityHub v1.0.0-RC7 accepts
# only "org.eclipse.dspace.dcp.vc.type:<type>:<read|all|*>"
# (EdcScopeToCriterionTransformer). Portitor's PORTITOR_DCP_SCOPES is the
# same string (compose.yaml).
edc.iam.dcp.scopes.membership.id=membership
edc.iam.dcp.scopes.membership.type=DEFAULT
edc.iam.dcp.scopes.membership.value=org.eclipse.dspace.dcp.vc.type:MembershipCredential:read

# the demo authority (test-issuer) issues every MembershipCredential
edc.iam.trustedissuer.authority.id=did:web:authority

# read status lists again after a second, so the revocation check sees a
# revocation at once (default: 15 minutes)
edc.iam.credential.revocation.cache.validity=1000

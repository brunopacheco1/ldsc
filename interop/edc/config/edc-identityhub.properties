#
# EDC IdentityHub (v1.0.0-RC7) of the EDC interop test. Ports and paths as
# in EDC's Minimum Viable Dataspace. Test-only: plain HTTP, a dev Vault.

web.http.port=7080
web.http.path=/api
web.http.identity.port=7081
web.http.identity.path=/api/identity
web.http.credentials.port=7082
web.http.credentials.path=/api/credentials
web.http.did.port=7083
web.http.did.path=/
web.http.sts.port=7084
web.http.sts.path=/api/sts

# did:web DIDs of the test are served over plain HTTP
edc.iam.did.web.use.https=false

edc.vault.hashicorp.url=http://vault:8200
edc.vault.hashicorp.token=root

# the Identity API takes tokens signed by the demo authority
# (test-issuer admin-token); its key set is on the authority's web server
edc.iam.oauth2.issuer=did:web:authority
edc.iam.oauth2.jwks.url=http://authority/.well-known/jwks.json
